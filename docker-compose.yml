  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - 9091:9090
    volumes:
      - ./cfg/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./cfg/minio_prometheus_token:/etc/prometheus/minio_token
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - forsen

  loki:
    image: grafana/loki:2.9.2
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./cfg/loki/local-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - forsen

  promtail:
    image: grafana/promtail:2.9.2
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal
      - /etc/machine-id:/etc/machine-id
      - ./cfg/promtail/config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    restart: unless-stopped
    networks:
      - forsen

  grafana:
    user: root
    image: grafana/grafana:12.4.5
    ports:
      - 2999:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_DOMAIN=forsen.fun
      - GF_SERVER_ROOT_URL=https://forsen.fun/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana-data-1:/etc/grafana
      - grafana-data-2:/var/lib/grafana
      - ./cfg/grafana/provisioning:/etc/grafana/provisioning
      - ./cfg/grafana/dashboards:/var/lib/grafana/dashboards
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - forsen

  # message archive (adr/history-archive.md); only reachable from localhost
  # and the compose network (grafana). Native port 9000 is remapped: minio
  # already owns host 9000.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.31
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9010:9000
    environment:
      CLICKHOUSE_DB: archive
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      # host THP is "always" for the model servers; khugepaged fills jemalloc's
      # sparse retained ranges until RSS crosses the RSS-based server memory cap
      # and every query fails. abort_conf makes an ignored option fatal.
      MALLOC_CONF: thp:never,abort_conf:true
    env_file:
      - .env
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./cfg/clickhouse/config.xml:/etc/clickhouse-server/config.d/archive.xml:ro
      - ./cfg/clickhouse/users.xml:/etc/clickhouse-server/users.d/archive.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cpus: "8"
    mem_limit: 12g
    restart: unless-stopped
    networks:
      - forsen

  postgres:
    image: pg_uuidv7:latest
    user: root
    cpus: "2"
    ports:
      - 6444:5432
    command: postgres -c 'shared_buffers=4GB' -c 'effective_cache_size=12GB' -c 'work_mem=41MB' -c 'maintenance_work_mem=819MB' -c 'min_wal_size=2GB' -c 'max_wal_size=3GB' -c 'random_page_cost=1.1' -c 'effective_io_concurrency=200' -c 'max_parallel_workers=12'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    volumes:
       - pg-data:/data/postgres
    restart: unless-stopped
    networks:
      - forsen

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    restart: unless-stopped
    networks:
      - forsen

  emote-postgres:
    image: pgvector/pgvector:pg17
    user: root
    cpus: "2"
    ports:
      - 6445:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    volumes:
      - emote-pg-data:/data/postgres
    restart: unless-stopped
    networks:
      - forsen

volumes:
  ch-data:
  pg-data:
  emote-pg-data:
  grafana-data-1:
  grafana-data-2:
  influxdb-data:

networks:
  isolated:
    driver: bridge
    internal: true
  forsen:

# sudo docker-compose up --force-recreate -d
