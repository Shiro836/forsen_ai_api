apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  # password comes from .env (gitignored) through the container environment
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: ClickHouse
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: app
      defaultDatabase: archive
      dialTimeout: 10
      queryTimeout: 60
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
