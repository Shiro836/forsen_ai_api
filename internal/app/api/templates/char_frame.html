{{ block "char_frame" . }}

<div class="grid grid-rows-12 grid-cols-12 w-full h-full overflow-hidden [&:has(input[name=enabled]:not(:checked))]:opacity-50 [&:has(input[name=enabled]:not(:checked))]:grayscale">
    {{ if not .DefaultVoice }}
    <label class="row-start-1 row-end-2 col-start-11 col-end-13 flex items-start justify-end pt-1.5 pr-1.5 cursor-pointer">
        <input type="checkbox" name="enabled" class="peer sr-only" {{ if not .Disabled }}checked{{ end }}
            hx-post="/characters/{{ .Card.ID }}/enabled" hx-trigger="change" hx-swap="none" />
        <svg class="w-4 h-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 peer-checked:text-green-500 dark:peer-checked:text-green-400"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
    </label>
    {{ end }}
    <img class="col-start-2 col-end-7 row-start-2 row-end-7 object-contain max-h-full"
        src="/characters/{{ .Card.ID }}/image?w=200" loading="lazy"></img>
    <div class="col-start-1 col-end-13 row-start-7 row-end-9 text-xl text-center truncate px-2">{{ .Card.Name }}</div>
    {{ if .Author }}
    <div class="col-start-1 col-end-13 row-start-9 row-end-10 text-xs/tight text-center text-gray-600 dark:text-gray-300 truncate px-2"
        title="{{ .Author }}">by {{ .Author }}</div>
    {{ end }}
    <div class="col-start-1 col-end-13 row-start-10 row-end-11 text-sm flex items-center justify-center gap-4">
        <span class="flex items-center gap-1" title="AI redeems">
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8V4H8" />
                <rect x="4" y="8" width="16" height="12" rx="2" />
                <path d="M2 14h2" />
                <path d="M20 14h2" />
                <path d="M15 13v2" />
                <path d="M9 13v2" />
            </svg>
            {{ .Card.Redeems }}
        </span>
        <span class="flex items-center gap-1" title="TTS redeems">
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            {{ .Card.TTSRedeems }}
        </span>
    </div>
    {{ if .CanEdit }}
    <button class="row-start-11 row-end-13 col-start-2 col-end-5 my-1.5 mx-1 text-sm {{template "button-2"}}"
        hx-get="/characters/{{ .Card.ID }}"
        hx-select="#tab-content" hx-swap="outerHTML" hx-target="#tab-content" hx-push-url="true"
        hx-sync="#tabs:abort">Edit</button>
    <button class="row-start-11 row-end-13 col-start-5 col-end-8 my-1.5 mx-1 text-sm {{template "button-2"}}"
        hx-get="/characters/{{ .Card.ID }}/try"
        hx-select="#tab-content" hx-swap="outerHTML" hx-target="#tab-content" hx-push-url="true"
        hx-sync="#tabs:abort">Try</button>
    <button class="row-start-11 row-end-13 col-start-8 col-end-11 my-1.5 mx-1 text-sm {{template "button-2"}}"
        hx-get="/characters/{{ .Card.ID }}/reward"
        hx-select="#tab-content" hx-swap="outerHTML" hx-target="#tab-content" hx-push-url="true"
        hx-sync="#tabs:abort">Add</button>
    {{ else }}
    <button class="row-start-11 row-end-13 col-start-3 col-end-7 my-1.5 mx-1 text-sm {{template "button-2"}}"
        hx-get="/characters/{{ .Card.ID }}/try"
        hx-select="#tab-content" hx-swap="outerHTML" hx-target="#tab-content" hx-push-url="true"
        hx-sync="#tabs:abort">Try</button>
    <button class="row-start-11 row-end-13 col-start-7 col-end-11 my-1.5 mx-1 text-sm {{template "button-2"}}"
        hx-get="/characters/{{ .Card.ID }}/reward"
        hx-select="#tab-content" hx-swap="outerHTML" hx-target="#tab-content" hx-push-url="true"
        hx-sync="#tabs:abort">Add</button>
    {{ end }}
    {{ if .IsAdmin }}
    <form class="row-start-2 row-end-5 col-start-7 col-end-12 flex flex-col justify-start gap-1.5"
        hx-post="/characters/{{ .Card.ID }}/admin/update_short_char_name" hx-target="closest div">
        <input type="text" name="short_name" placeholder="Short name" autocomplete="off"
            value="{{ if .Card.ShortCharName.Valid }}{{ .Card.ShortCharName.String }}{{ end }}"
            class="w-full min-w-0 text-sm px-2 py-1.5 {{template "input-class"}}" />
        <button type="submit"
            class="self-end text-xs px-3 py-1 {{template "button-2"}}">Save</button>
    </form>
    {{ end }}
</div>

{{ end }}
